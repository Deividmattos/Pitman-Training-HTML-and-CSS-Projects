<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
    <link rel="stylesheet" href="css/Basic_HTML_and_Css.css">
</head>

<body>
    <table>
        <tr>
            <th>Country</th>
            <th>Capital</th>
            <th>Population</th>
        </tr>

        <tr>
            <td>Ireland</td>
            <td>Dublin</td>
            <td>5.3 million</td>
        </tr>

        <tr>
            <td>Italy</td>
            <td>Rome</td>
            <td>59 million</td>
        </tr>

        <tr>
            <td>France</td>
            <td>Paris</td>
            <td>68 million</td>
        </tr>

    </table>
</body>

</html>
