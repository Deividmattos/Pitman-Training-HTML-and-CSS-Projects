<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML 4</title>

    <style>
        body {
            background-color: #d902d9;
        }

        h1 {
            color: rgb(28, 4, 77);
            background-color: yellow;
        }

        p {
            color: blue;
        }

        h2 {
            color: rgb(4, 4, 55);
            text-align: center;
        }

        .My_Style {
            background-color: rgb(0, 255, 30);
            color: blue;
            text-decoration: underline;
            font-weight: bold;
            font-size: small;
            padding: 20px;

        }
    </style>
</head>

<body>

    <div>
        <h1>Welcome to Ireland!</h1>

        <p>Ireland is a beautiful country.</p>

        <p>I love the Irish landscape!</p>

        <p class="My_Style">This text uses My_Style.</p>

        <h2>Discover the beauty of Ireland</h2>
    </div>

</body>

</html>
