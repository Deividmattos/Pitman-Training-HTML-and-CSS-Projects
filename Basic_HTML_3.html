<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML 3</title>

    <style>
        body {
            background-color: rgb(147, 144, 238);
        }

        h1 {
            color: rgb(236, 232, 234);
        }

        p {
            color: rgb(255, 38, 0);
        }

        h2 {
            color: blue;
            text-align: center;
        }
    </style>
</head>

<body>
    <div>
        <h1>Welcome to Ireland!</h1>
        <p>Ireland is a beautiful country.</p>
        <p>I love the Irish landscape!</p>
        <h2>Discover the beauty of Ireland</h2>
    </div>

</body>

</html>
