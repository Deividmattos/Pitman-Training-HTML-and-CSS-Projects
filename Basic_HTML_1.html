<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Assignment</title>
</head>
<body>
     <p>
        <font color="green">This text is red using a color name.</font>
    </p>

    <h6>
        <font color="#7004FF">This text is blue using a hexadecimal color code.</font>
    </h6>

    <p>
    <font face="Arial" size="2">
        This is size 2 using Arial font.
    </font>
</p>

<h3>
    <font face="Times New Roman" size="4">
        This is size 4 using Times New Roman font.
    </font>
</h3>

<p>
    <font face="Verdana" size="6">
        This is size 6 using Verdana font.
    </font>
</p>

<h1>
    <b>This text is bold.</b>
</h1>

<h2>
    <i>This text is italic.</i>
</h2>

<span>
    <u>This text is underlined.</u>
</span>







</body>
</html>
